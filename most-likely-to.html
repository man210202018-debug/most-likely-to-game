<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مين أكتر واحد فينا؟ 💕</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --rose: #b76e79;
  --rose-light: #d4a0a7;
  --rose-gold: #e8c4c8;
  --purple-deep: #2d1b4e;
  --purple-mid: #4a2c6e;
  --purple-light: #6b3fa0;
  --dark-bg: #1a1025;
  --dark-card: #241635;
  --dark-card-hover: #2e1e42;
  --text-primary: #f0e6f6;
  --text-secondary: #b8a5c8;
  --accent-pink: #ff6b9d;
  --accent-gold: #f0c27f;
  --gradient-main: linear-gradient(135deg, #b76e79, #6b3fa0);
  --gradient-card: linear-gradient(145deg, #2d1b4e, #1a1025);
  --shadow-glow: 0 0 40px rgba(183, 110, 121, 0.15);
}

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--dark-bg);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-decoration {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.bg-decoration .circle {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
  animation: floatBubble 20s ease-in-out infinite;
}

.bg-decoration .circle:nth-child(1) {
  width: 400px;
  height: 400px;
  background: var(--rose);
  top: -100px;
  right: -100px;
  animation-delay: 0s;
}

.bg-decoration .circle:nth-child(2) {
  width: 350px;
  height: 350px;
  background: var(--purple-light);
  bottom: -80px;
  left: -80px;
  animation-delay: -7s;
}

.bg-decoration .circle:nth-child(3) {
  width: 250px;
  height: 250px;
  background: var(--accent-pink);
  top: 50%;
  left: 50%;
  animation-delay: -14s;
}

@keyframes floatBubble {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -40px) scale(1.05); }
  50% { transform: translate(-20px, 20px) scale(0.95); }
  75% { transform: translate(40px, 30px) scale(1.02); }
}

.screen {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding: 20px;
  animation: fadeInUp 0.6s ease-out;
}

.screen.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.15); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
  60% { transform: scale(1); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(60px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-60px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes confetti-fall {
  0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
  50% { opacity: 1; transform: scale(1) rotate(180deg); }
}

@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.05); }
  70% { transform: scale(0.95); }
  100% { transform: scale(1); opacity: 1; }
}

.welcome-card {
  background: var(--gradient-card);
  border: 1px solid rgba(183, 110, 121, 0.2);
  border-radius: 24px;
  padding: 40px 30px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-glow);
  animation: scaleIn 0.6s ease-out;
}

.welcome-emoji {
  font-size: 64px;
  animation: heartBeat 2s ease-in-out infinite;
  display: block;
  margin-bottom: 16px;
}

.welcome-title {
  font-size: 28px;
  font-weight: 900;
  background: var(--gradient-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  line-height: 1.4;
}

.welcome-subtitle {
  color: var(--text-secondary);
  font-size: 15px;
  margin-bottom: 32px;
  line-height: 1.8;
}

.name-input-group {
  margin-bottom: 20px;
  text-align: right;
}

.name-input-group label {
  display: block;
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}

.name-input-group input {
  width: 100%;
  padding: 14px 18px;
  border: 2px solid rgba(183, 110, 121, 0.3);
  border-radius: 14px;
  background: rgba(26, 16, 37, 0.8);
  color: var(--text-primary);
  font-family: 'Tajawal', sans-serif;
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
}

.name-input-group input::placeholder {
  color: rgba(184, 165, 200, 0.4);
}

.name-input-group input:focus {
  border-color: var(--rose);
  box-shadow: 0 0 20px rgba(183, 110, 121, 0.2);
}

.start-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: var(--gradient-main);
  color: white;
  font-family: 'Tajawal', sans-serif;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 12px;
  position: relative;
  overflow: hidden;
}

.start-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition: left 0.5s ease;
}

.start-btn:hover::before {
  left: 100%;
}

.start-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(183, 110, 121, 0.4);
}

.start-btn:active {
  transform: translateY(0);
}

.heart-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: var(--rose);
  font-size: 12px;
}

.heart-divider::before,
.heart-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--rose), transparent);
}

.game-screen {
  justify-content: flex-start;
  padding-top: 30px;
  gap: 20px;
}

.game-header {
  width: 100%;
  max-width: 460px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.progress-info {
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 500;
}

.progress-bar-container {
  width: 100%;
  max-width: 460px;
  height: 6px;
  background: rgba(107, 63, 160, 0.3);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--gradient-main);
  border-radius: 3px;
  transition: width 0.5s ease;
}

.question-card {
  background: var(--gradient-card);
  border: 1px solid rgba(183, 110, 121, 0.15);
  border-radius: 24px;
  padding: 36px 28px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-glow);
  position: relative;
  overflow: hidden;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gradient-main);
}

.question-number {
  font-size: 13px;
  color: var(--rose-light);
  font-weight: 500;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.question-text {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.7;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.question-emoji {
  font-size: 36px;
  margin-bottom: 16px;
  display: block;
}

.vote-buttons {
  display: flex;
  gap: 14px;
  margin-top: 28px;
  width: 100%;
}

.vote-btn {
  flex: 1;
  padding: 18px 12px;
  border: 2px solid;
  border-radius: 16px;
  background: transparent;
  font-family: 'Tajawal', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.vote-btn.player1 {
  border-color: var(--rose);
  color: var(--rose-light);
}

.vote-btn.player1:hover,
.vote-btn.player1.voted {
  background: rgba(183, 110, 121, 0.2);
  border-color: var(--rose-light);
  color: var(--rose-light);
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(183, 110, 121, 0.3);
}

.vote-btn.player2 {
  border-color: var(--purple-light);
  color: #a78bfa;
}

.vote-btn.player2:hover,
.vote-btn.player2.voted {
  background: rgba(107, 63, 160, 0.2);
  border-color: #a78bfa;
  color: #a78bfa;
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(107, 63, 160, 0.3);
}

.vote-btn:active {
  transform: translateY(0) scale(0.97);
}

.vote-btn .btn-emoji {
  display: block;
  font-size: 28px;
  margin-bottom: 6px;
}

.next-btn {
  padding: 14px 36px;
  border: none;
  border-radius: 14px;
  background: var(--gradient-main);
  color: white;
  font-family: 'Tajawal', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  margin-top: 20px;
}

.next-btn.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.next-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(183, 110, 121, 0.4);
}

.voted-feedback {
  margin-top: 16px;
  font-size: 14px;
  color: var(--accent-gold);
  opacity: 0;
  transition: opacity 0.3s ease;
  font-weight: 500;
}

.voted-feedback.show {
  opacity: 1;
  animation: bounceIn 0.5s ease;
}

.skip-btn {
  background: none;
  border: 1px solid rgba(184, 165, 200, 0.3);
  color: var(--text-secondary);
  padding: 10px 24px;
  border-radius: 12px;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 12px;
}

.skip-btn:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
}

.sparkle-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
}

.sparkle {
  position: absolute;
  font-size: 20px;
  animation: sparkle 0.8s ease-out forwards;
}

.confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confetti-fall linear forwards;
}

.results-screen {
  padding-top: 30px;
  padding-bottom: 40px;
}

.results-card {
  background: var(--gradient-card);
  border: 1px solid rgba(183, 110, 121, 0.2);
  border-radius: 24px;
  padding: 36px 28px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-glow);
  animation: scaleIn 0.6s ease-out;
}

.results-emoji {
  font-size: 56px;
  display: block;
  margin-bottom: 12px;
  animation: heartBeat 2s ease-in-out infinite;
}

.results-title {
  font-size: 26px;
  font-weight: 900;
  background: var(--gradient-main);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 24px;
}

.score-summary {
  display: flex;
  gap: 16px;
  margin-bottom: 28px;
}

.score-box {
  flex: 1;
  padding: 20px 12px;
  border-radius: 16px;
  text-align: center;
}

.score-box.p1 {
  background: rgba(183, 110, 121, 0.15);
  border: 1px solid rgba(183, 110, 121, 0.3);
}

.score-box.p2 {
  background: rgba(107, 63, 160, 0.15);
  border: 1px solid rgba(107, 63, 160, 0.3);
}

.score-box .score-name {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}

.score-box .score-number {
  font-size: 40px;
  font-weight: 900;
}

.score-box.p1 .score-number {
  color: var(--rose-light);
}

.score-box.p2 .score-number {
  color: #a78bfa;
}

.score-box .score-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.result-message {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 28px;
  padding: 16px;
  background: rgba(240, 194, 127, 0.08);
  border-radius: 14px;
  border: 1px solid rgba(240, 194, 127, 0.15);
}

.result-message .highlight {
  color: var(--accent-gold);
  font-weight: 700;
}

.titles-section {
  margin-bottom: 28px;
}

.titles-section h3 {
  font-size: 16px;
  color: var(--rose-light);
  margin-bottom: 14px;
  font-weight: 700;
}

.title-badge {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  margin: 4px;
}

.title-badge.p1-badge {
  background: rgba(183, 110, 121, 0.2);
  color: var(--rose-light);
  border: 1px solid rgba(183, 110, 121, 0.3);
}

.title-badge.p2-badge {
  background: rgba(107, 63, 160, 0.2);
  color: #a78bfa;
  border: 1px solid rgba(107, 63, 160, 0.3);
}

.results-actions {
  display: flex;
  gap: 12px;
}

.results-actions button {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.replay-btn {
  background: var(--gradient-main);
  border: none;
  color: white;
}

.replay-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(183, 110, 121, 0.4);
}

.share-btn {
  background: transparent;
  border: 2px solid rgba(183, 110, 121, 0.4);
  color: var(--rose-light);
}

.share-btn:hover {
  border-color: var(--rose);
  background: rgba(183, 110, 121, 0.1);
  transform: translateY(-2px);
}

.detailed-results {
  margin-top: 24px;
  width: 100%;
  max-width: 460px;
}

.detailed-results h3 {
  font-size: 16px;
  color: var(--rose-light);
  margin-bottom: 14px;
  font-weight: 700;
  text-align: center;
}

.result-item {
  background: rgba(36, 22, 53, 0.6);
  border: 1px solid rgba(183, 110, 121, 0.1);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.result-item .q-text {
  color: var(--text-secondary);
  flex: 1;
  margin-left: 10px;
  text-align: right;
}

.result-item .winner-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
}

.result-item .winner-badge.p1 {
  background: rgba(183, 110, 121, 0.2);
  color: var(--rose-light);
}

.result-item .winner-badge.p2 {
  background: rgba(107, 63, 160, 0.2);
  color: #a78bfa;
}

.result-item .winner-badge.skipped {
  background: rgba(184, 165, 200, 0.1);
  color: var(--text-secondary);
}

@media (max-width: 500px) {
  .welcome-card, .question-card, .results-card {
    padding: 28px 20px;
    border-radius: 20px;
  }

  .welcome-title {
    font-size: 24px;
  }

  .question-text {
    font-size: 19px;
  }

  .vote-btn {
    padding: 14px 8px;
    font-size: 14px;
  }

  .vote-btn .btn-emoji {
    font-size: 24px;
  }

  .score-box .score-number {
    font-size: 32px;
  }
}
</style>
</head>
<body>

<div class="bg-decoration">
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
</div>

<div class="sparkle-container" id="sparkleContainer"></div>
<div class="confetti-container" id="confettiContainer"></div>

<div class="screen active" id="welcomeScreen">
  <div class="welcome-card">
    <span class="welcome-emoji">💕</span>
    <h1 class="welcome-title">مين أكتر واحد فينا؟</h1>
    <p class="welcome-subtitle">
      لعبة ممتعة للمرتبطين!<br>
      اكتشفي معلومات ممتعة عن بعضكم
    </p>
    <div class="name-input-group">
      <label>اسم الطرف الأول 💫</label>
      <input type="text" id="player1Name" placeholder="مثلاً: سارة" maxlength="20">
    </div>
    <div class="name-input-group">
      <label>اسم الطرف الثاني ✨</label>
      <input type="text" id="player2Name" placeholder="مثلاً: أحمد" maxlength="20">
    </div>
    <button class="start-btn" onclick="startGame()">
      ابدأ اللعبة 💕
    </button>
  </div>
</div>

<div class="screen game-screen" id="gameScreen">
  <div class="game-header">
    <span class="progress-info" id="progressText">1 / 30</span>
    <span class="progress-info" id="scoreDisplay">💛</span>
  </div>
  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
  </div>
  <div class="question-card" id="questionCard">
    <span class="question-emoji" id="questionEmoji">🤔</span>
    <div class="question-number" id="questionNumber">السؤال 1 من 30</div>
    <div class="question-text" id="questionText"></div>
    <div class="vote-buttons">
      <button class="vote-btn player1" id="voteBtn1" onclick="vote(1)">
        <span class="btn-emoji">🙋</span>
        <span id="btn1Name">...</span>
      </button>
      <button class="vote-btn player2" id="voteBtn2" onclick="vote(2)">
        <span class="btn-emoji">🙋</span>
        <span id="btn2Name">...</span>
      </button>
    </div>
    <div class="voted-feedback" id="votedFeedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
      السؤال التالي ←
    </button>
    <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">
      تخطي السؤال ⏭️
    </button>
  </div>
</div>

<div class="screen results-screen" id="resultsScreen">
  <div class="results-card">
    <span class="results-emoji">🏆</span>
    <h1 class="results-title">النتيجة النهائية!</h1>
    <div class="score-summary">
      <div class="score-box p1">
        <div class="score-name" id="resultP1Name">...</div>
        <div class="score-number" id="resultP1Score">0</div>
        <div class="score-label">تصويت</div>
      </div>
      <div class="score-box p2">
        <div class="score-name" id="resultP2Name">...</div>
        <div class="score-number" id="resultP2Score">0</div>
        <div class="score-label">تصويت</div>
      </div>
    </div>
    <div class="result-message" id="resultMessage"></div>
    <div class="titles-section" id="titlesSection"></div>
    <div class="results-actions">
      <button class="replay-btn" onclick="resetGame()">العب مرة ثانية 🔄</button>
      <button class="share-btn" onclick="shareResults()">شارك النتيجة 📸</button>
    </div>
  </div>
  <div class="detailed-results" id="detailedResults"></div>
</div>

<script>
const questions = [
  { q: "مين أكتر واحد فينا بيعاند؟", emoji: "😤" },
  { q: "مين أكتر واحد بيعطلنا قبل النزول؟", emoji: "⏰" },
  { q: "مين أكتر واحد بينام وهو بيكلم التاني؟", emoji: "😴" },
  { q: "مين أكتر واحد بيرسل رسائل كتير أوي؟", emoji: "💌" },
  { q: "مين أكتر واحد بيتخانق في الشارع؟", emoji: "🗣️" },

let player1 = "الطرف الأول";
let player2 = "الطرف الثاني";
let currentQ = 0;
let score1 = 0;
let score2 = 0;
let answered = false;
let results = [];
let shuffledQuestions = [];

function shuffleArray(arr) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function startGame() {
  const n1 = document.getElementById('player1Name').value.trim();
  const n2 = document.getElementById('player2Name').value.trim();

  if (!n1 || !n2) {
    const inputs = document.querySelectorAll('.name-input-group input');
    inputs.forEach(input => {
      if (!input.value.trim()) {
        input.style.borderColor = '#ff6b9d';
        input.style.animation = 'pulse 0.3s ease';
        setTimeout(() => {
          input.style.animation = '';
        }, 300);
      }
    });
    return;
  }

  player1 = n1;
  player2 = n2;
  currentQ = 0;
  score1 = 0;
  score2 = 0;
  results = [];
  shuffledQuestions = shuffleArray(questions);

  document.getElementById('btn1Name').textContent = player1;
  document.getElementById('btn2Name').textContent = player2;

  switchScreen('gameScreen');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = shuffledQuestions[currentQ];
  const total = shuffledQuestions.length;

  document.getElementById('questionEmoji').textContent = q.emoji;
  document.getElementById('questionNumber').textContent = `السؤال ${currentQ + 1} من ${total}`;
  document.getElementById('progressText').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${((currentQ) / total) * 100}%`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('scoreDisplay').textContent = `💛 ${score1} - ${score2}`;

  document.getElementById('voteBtn1').className = 'vote-btn player1';
  document.getElementById('voteBtn2').className = 'vote-btn player2';
  document.getElementById('nextBtn').className = 'next-btn';
  document.getElementById('skipBtn').style.display = 'block';
  document.getElementById('votedFeedback').className = 'voted-feedback';
  document.getElementById('votedFeedback').textContent = '';

  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'scaleIn 0.4s ease-out';
}

function vote(player) {
  if (answered) return;
  answered = true;

  const winnerName = player === 1 ? player1 : player2;
  document.getElementById('votedFeedback').textContent = `${winnerName} كسب(ت) التصويت! ✨`;
  document.getElementById('votedFeedback').className = 'voted-feedback show';

  if (player === 1) {
    score1++;
    document.getElementById('voteBtn1').className = 'vote-btn player1 voted';
  } else {
    score2++;
    document.getElementById('voteBtn2').className = 'vote-btn player2 voted';
  }

  results.push({
    question: shuffledQuestions[currentQ].q,
    winner: player,
    winnerName: winnerName
  });

  createSparkles();

  document.getElementById('skipBtn').style.display = 'none';

  if (currentQ < shuffledQuestions.length - 1) {
    document.getElementById('nextBtn').className = 'next-btn visible';
  } else {
    setTimeout(() => showResults(), 800);
  }
}

function skipQuestion() {
  if (answered) return;
  results.push({
    question: shuffledQuestions[currentQ].q,
    winner: 0,
    winnerName: 'تم التخطي'
  });

  if (currentQ < shuffledQuestions.length - 1) {
    currentQ++;
    showQuestion();
  } else {
    showResults();
  }
}

function nextQuestion() {
  currentQ++;
  showQuestion();
}

function showResults() {
  document.getElementById('resultP1Name').textContent = player1;
  document.getElementById('resultP2Name').textContent = player2;
  document.getElementById('resultP1Score').textContent = score1;
  document.getElementById('resultP2Score').textContent = score2;

  const diff = Math.abs(score1 - score2);
  const totalAnswered = score1 + score2;
  let msg = '';

  if (totalAnswered === 0) {
    msg = `أنتوا الاتنين خليتوها عال鲇! 😄`;
  } else if (score1 === score2) {
    msg = `<span class="highlight">${player1}</span> و<span class="highlight">${player2}</span> متساويين تماماً! 💕 تعكسوا بعض تماماً!`;
  } else if (diff <= 3) {
    msg = `<span class="highlight">${player1}</span> و<span class="highlight">${player2}</span> قريبين من بعض أوي! شبه بعض في كل حاجة 💞`;
  } else {
    const topName = score1 > score2 ? player1 : player2;
    const topScore = Math.max(score1, score2);
    msg = `<span class="highlight">${topName}</span> عندها/ه ${topScore} تصويت! أكتر واحدة فينا بجد! 🏆`;
  }

  document.getElementById('resultMessage').innerHTML = msg;

  const titles = [];
  results.forEach(r => {
    if (r.winner !== 0) {
      const isP1 = r.winner === 1;
      titles.push({
        text: r.question.replace('مين أكتر واحد فينا', ''),
        name: r.winnerName,
        isP1: isP1
      });
    }
  });

  const titlesSection = document.getElementById('titlesSection');
  if (titles.length > 0) {
    titlesSection.innerHTML = '<h3>ملخص الألقاب 🏅</h3>';
    titles.slice(0, 8).forEach(t => {
      const badgeClass = t.isP1 ? 'title-badge p1-badge' : 'title-badge p2-badge';
      titlesSection.innerHTML += `<span class="${badgeClass}">${t.name}: ${t.text}</span>`;
    });
  } else {
    titlesSection.innerHTML = '';
  }

  const detailed = document.getElementById('detailedResults');
  if (results.length > 0) {
    detailed.innerHTML = '<h3>تفاصيل كل سؤال 📋</h3>';
    results.forEach((r, i) => {
      let badgeHTML = '';
      if (r.winner === 1) {
        badgeHTML = `<span class="winner-badge p1">${player1}</span>`;
      } else if (r.winner === 2) {
        badgeHTML = `<span class="winner-badge p2">${player2}</span>`;
      } else {
        badgeHTML = `<span class="winner-badge skipped">⏭️ تم التخطي</span>`;
      }
      detailed.innerHTML += `
        <div class="result-item">
          <span class="q-text">${r.question}</span>
          ${badgeHTML}
        </div>
      `;
    });
  }

  switchScreen('resultsScreen');
  createConfetti();
}

function resetGame() {
  currentQ = 0;
  score1 = 0;
  score2 = 0;
  results = [];
  document.getElementById('player1Name').value = '';
  document.getElementById('player2Name').value = '';
  switchScreen('welcomeScreen');
}

function shareResults() {
  const winner = score1 > score2 ? player1 : score2 > score2 ? player2 : null;
  let text = `💕 مين أكتر واحد فينا؟ 💕\n\n`;
  text += `📊 ${player1}: ${score1} تصويت\n`;
  text += `📊 ${player2}: ${score2} تصويت\n\n`;

  if (score1 === score2) {
    text += `⚖️ تعادل! شبه بعض في كل حاجة! 💞\n`;
  } else {
    const topName = score1 > score2 ? player1 : player2;
    text += `🏆 ${topName} هو(ي) الأكتر واحد فينا!\n`;
  }

  text += `\n💎 لعبنا ${results.length} سؤال\n`;
  text += `\nجربوا اللعبة بنفسكم! 🎮`;

  if (navigator.share) {
    navigator.share({ text: text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.share-btn');
      const original = btn.textContent;
      btn.textContent = 'تم النسخ! ✅';
      setTimeout(() => btn.textContent = original, 2000);
    }).catch(() => {
      prompt('انسخ النتيجة:', text);
    });
  } else {
    prompt('انسخ النتيجة:', text);
  }
}

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0, 0);
}

function createSparkles() {
  const container = document.getElementById('sparkleContainer');
  const emojis = ['✨', '💫', '⭐', '💕', '💖', '🌟'];

  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      sparkle.style.left = Math.random() * 80 + 10 + '%';
      sparkle.style.top = Math.random() * 60 + 20 + '%';
      sparkle.style.animationDelay = Math.random() * 0.3 + 's';
      container.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 1000);
    }, i * 80);
  }
}

function createConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#b76e79', '#6b3fa0', '#e8c4c8', '#f0c27f', '#ff6b9d', '#a78bfa'];

  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.width = Math.random() * 8 + 5 + 'px';
      confetti.style.height = Math.random() * 8 + 5 + 'px';
      confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
      confetti.style.animationDelay = Math.random() * 0.5 + 's';
      container.appendChild(confetti);
      setTimeout(() => confetti.remove(), 4500);
    }, i * 50);
  }
}

document.querySelectorAll('.name-input-group input').forEach(input => {
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const allInputs = document.querySelectorAll('.name-input-group input');
      const currentIndex = Array.from(allInputs).indexOf(this);
      if (currentIndex < allInputs.length - 1) {
        allInputs[currentIndex + 1].focus();
      } else {
        startGame();
      }
    }
  });
});
